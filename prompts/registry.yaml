schema_version: "1.0"
default_version: "v1"
description: >
  Versioned prompt registry for SEC EDGAR Natural Language Analyst ADK agents
  and Model Armor safety/projection policy specifications.

prompts:
  financial_analyst:
    agent_name: "FinancialAnalystAgent"
    model: "gemini-3.8-flash"
    latest: "v6"
    versions:
      v1:
        semver: "1.0.0"
        path: "v1/financial_analyst.yaml"
      "1.0.0":
        semver: "1.0.0"
        path: "v1/financial_analyst.yaml"
      v5:
        semver: "5.0.0"
        path: "v5/financial_analyst.yaml"
      "5.0.0":
        semver: "5.0.0"
        path: "v5/financial_analyst.yaml"
      v6:
        semver: "6.0.0"
        path: "v6/financial_analyst.yaml"
      "6.0.0":
        semver: "6.0.0"
        path: "v6/financial_analyst.yaml"

  narrative_evaluator:
    agent_name: "NarrativeEvaluatorAgent"
    model: "gemini-3.5-flash"
    latest: "v1"
    versions:
      v1:
        semver: "1.0.0"
        path: "v1/narrative_evaluator.yaml"
      "1.0.0":
        semver: "1.0.0"
        path: "v1/narrative_evaluator.yaml"

  model_armor_policy:
    agent_name: "ModelArmorGuardrail"
    model: "policy"
    latest: "v1"
    versions:
      v1:
        semver: "1.0.0"
        path: "v1/model_armor_policy.yaml"
      "1.0.0":
        semver: "1.0.0"
        path: "v1/model_armor_policy.yaml"
