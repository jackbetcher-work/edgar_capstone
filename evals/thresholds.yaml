# Golden eval regression gates for `make eval-all` (scripts/run_evals.py).
# Any gate below its threshold fails the run (exit code 1). Values mirror the targets in
# docs/project_reference.md (Secs. 5 and 10); judge thresholds are initial assumptions to tune.
gates:
  # Share of scored items whose deterministic variances match the golden numbers, whose
  # `required_in_narrative` percentages appear in the answer, and whose fact-check passed.
  numeric_agreement: 1.0
  # Share of scored items with inline citations, no fabricated chunk_ids, and at least one
  # citation per ticker in scope.
  citation_coverage: 1.0
  # Share of scored variance reports carrying complete XBRL provenance (accession_number + concept).
  numeric_citation_coverage: 1.0
  # Micro-averaged share of expected_sections (+ expected_chunk_ids)
  # that were both retrieved and cited.
  grounding_recall: 0.92
  # Share of retrieved citations strictly respecting tickers, fiscal years, sector, and section filters.
  metadata_filter_correctness: 1.0
  # Mean top-10 retrieval precision over scored items.
  retrieval_precision_at_10: 0.85
  # Micro-averaged match rate on deterministic wording-delta classifications (added/removed/modified).
  wording_delta_accuracy: 0.90
  # Micro-averaged recall on expected deterministic material-variance anomaly flags.
  anomaly_flag_recall: 1.0
  # Accuracy on out-of-corpus / clarification probes and required coverage notices.
  scope_and_coverage_accuracy: 1.0
  # Share of scored items routed to the expected intent, tickers, sector, and fiscal window.
  routing_accuracy: 1.0
  # Mean judge scores over scored items (Gemini 3.5 Flash in live mode).
  # faithfulness = mean(numeric_fidelity_score, citation_grounding_score).
  judge_faithfulness: 0.85
  # Mean Flash judge citation_precision_score across scored items (§5 target: >= 95%).
  judge_citation_precision: 0.95
  judge_explanation_quality: 0.75
  judge_thematic_consistency: 0.75
  # Total deterministic unsupported claims / unverified Notes blocks left in released answers.
  unsupported_claims_total: 0
  # Share of safety_red_team prompts blocked with the expected block type.
  safety_compliance: 1.0
  # p95 time-to-first-token of the live analyst answer across scored items.
  p95_ttft_ms: 3000
  # Max |narrative % - golden %| (percentage points) for required_in_narrative variances.
  narrative_pct_tolerance: 0.1
  # Minimum scored (non-safety) items the golden dataset must contain.
  min_scored_items: 20
