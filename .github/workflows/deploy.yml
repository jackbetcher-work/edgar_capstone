name: SEC EDGAR Analyst CI/CD Pipeline

# Cloud Build (terraform/cloudbuild.tf + cloudbuild.yaml) is the primary deploy
# path. This workflow always runs the lint/test gates on every push. The build
# and deploy jobs run only on pushes to main, and only when the repository
# variable DEPLOY_WITH_GITHUB_ACTIONS is 'true'. That way a merge never deploys
# twice.

on:
  push:
    branches:
      - main
      - "**"
  # Manual redeploy from the Actions tab or `gh workflow run deploy.yml --ref main`.
  # Build/deploy jobs still require refs/heads/main and DEPLOY_WITH_GITHUB_ACTIONS == 'true'.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sec-edgar-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: iron-radio-514217-q7
  GCP_PROJECT_NAME: fde-sec-edgar-sandbox-dev
  GCP_REGION: us-central1
  GAR_REPOSITORY: sec-edgar-repo
  SERVICE_NAME: sec-edgar-analyst
  RUNTIME_SERVICE_ACCOUNT: sec-analyst-sa@iron-radio-514217-q7.iam.gserviceaccount.com
  CLOUD_IDENTITY_DOMAIN: fde-workspace.corp
  IMAGE_URI: us-central1-docker.pkg.dev/iron-radio-514217-q7/sec-edgar-repo/sec-edgar-analyst

jobs:
  # ============================================================================
  # Stage 1: Test — Secret leak verification, Terraform lint, backend & frontend
  # ============================================================================
  test:
    name: Test Stage - Secret Scan, Lint, Unit Tests & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify no secrets or keys are exposed in pipeline or codebase
        run: |
          python scripts/verify_no_secrets.py

      - name: Lint and format-check Python (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check --diff .

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting and validate configuration
        run: |
          terraform fmt -check -recursive -diff terraform/
          terraform -chdir=terraform init -backend=false -input=false -no-color
          terraform -chdir=terraform validate -no-color

      # The suite reads live BigQuery / Vertex AI Search / GCS data and calls Vertex AI
      # (embeddings, Gemini, Model Armor), so authenticate with keyless WIF first.
      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SERVICE_ACCOUNT }}

      - name: Run automated pytest suite against live GCP
        env:
          EDGAR_TEST_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_REGION }}
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          EDGAR_GEMINI_LOCATION: global
          EDGAR_TELEMETRY_BACKEND: local
          EDGAR_FEEDBACK_BACKEND: local
        run: |
          pytest -v --tb=short

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install, lint, test, and build frontend bundle
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run lint
          npm --prefix frontend test
          npm --prefix frontend run build
          test -f frontend/dist/index.html

  # ============================================================================
  # Stage 2: Build — Keyless WIF auth, Secret Manager lookup & Docker image push
  # ============================================================================
  build:
    name: Build Stage - Container Image & Artifact Registry
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_WITH_GITHUB_ACTIONS == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_digest_uri: ${{ steps.build_image.outputs.image_uri }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Retrieve build-time configuration from Google Cloud Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            SEC_EDGAR_USER_AGENT:${{ env.GCP_PROJECT_ID }}/sec-edgar-user-agent:latest
          export_environment: false

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push container image with compiled frontend (zero embedded secrets)
        id: build_image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          test -n "${{ steps.secrets.outputs.SEC_EDGAR_USER_AGENT }}"
          IMAGE_TAG="${{ env.IMAGE_URI }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.IMAGE_URI }}:latest"
          docker build \
            --build-arg COMMIT_SHA="${{ github.sha }}" \
            --tag "${IMAGE_TAG}" \
            --tag "${IMAGE_LATEST}" \
            .
          docker run --rm --entrypoint test "${IMAGE_TAG}" -f /app/frontend/dist/index.html
          # Container smoke test: /health + data_backend block and the UI at /. The live
          # BigQuery read (--live-data) runs in Cloud Build, where the container gets ADC.
          docker run --rm \
            -e GCP_PROJECT_ID="${{ env.GCP_PROJECT_ID }}" \
            -e GOOGLE_CLOUD_PROJECT="${{ env.GCP_PROJECT_ID }}" \
            -e GOOGLE_CLOUD_LOCATION="${{ env.GCP_REGION }}" \
            -e GOOGLE_GENAI_USE_VERTEXAI=true \
            -e EDGAR_GEMINI_LOCATION=global \
            -e EDGAR_TELEMETRY_BACKEND=local \
            -e EDGAR_FEEDBACK_BACKEND=local \
            --entrypoint python \
            "${IMAGE_TAG}" \
            -m scripts.container_smoke_test --in-process
          docker push "${IMAGE_TAG}"
          docker push "${IMAGE_LATEST}"
          echo "image_uri=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

  # ============================================================================
  # Stage 3: Deploy — Secret Manager integration & Google Cloud Run deployment
  # ============================================================================
  deploy:
    name: Deploy Stage - Google Cloud Run with Secret Manager
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_WITH_GITHUB_ACTIONS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Retrieve runtime secrets metadata from Google Cloud Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            SEC_EDGAR_USER_AGENT:${{ env.GCP_PROJECT_ID }}/sec-edgar-user-agent:latest
            GEMINI_API_KEY:${{ env.GCP_PROJECT_ID }}/sec-edgar-gemini-api-key:latest
            INTERNAL_IAP_AUDIENCE:${{ env.GCP_PROJECT_ID }}/sec-edgar-iap-audience:latest
          export_environment: false

      - name: Deploy service to Google Cloud Run with Secret Manager mounts
        id: deploy_cloud_run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}:${{ github.sha }}
          env_vars: |-
            GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ env.GCP_PROJECT_ID }}
            GCP_PROJECT_NAME=${{ env.GCP_PROJECT_NAME }}
            GCP_REGION=${{ env.GCP_REGION }}
            GOOGLE_CLOUD_LOCATION=${{ env.GCP_REGION }}
            GOOGLE_GENAI_USE_VERTEXAI=true
            EDGAR_ANALYST_MODEL=gemini-3.8-flash
            EDGAR_GEMINI_LOCATION=global
            EDGAR_FLASH_MODEL=gemini-3.5-flash
            EDGAR_MODEL_ARMOR_MODE=gcp
            MODEL_ARMOR_TEMPLATE_ID=sec-edgar-analyst-armor
            EDGAR_PROMPT_STORE_BACKEND=auto
            RUNTIME_SERVICE_ACCOUNT=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            CLOUD_IDENTITY_DOMAIN=${{ env.CLOUD_IDENTITY_DOMAIN }}
            ADMIN_CLOUD_IDENTITY_GROUPS=sec-edgar-admins@fde-workspace.corp
            ANALYST_CLOUD_IDENTITY_GROUPS=sec-edgar-analysts@fde-workspace.corp
            VIEWER_CLOUD_IDENTITY_GROUPS=sec-edgar-viewers@fde-workspace.corp
            BIGQUERY_DATASET_ID=sec_edgar
            SEC_CORPUS_BUCKET=fde-sec-edgar-sandbox-dev-sec-corpus
            EDGAR_TELEMETRY_BACKEND=gcp
            EDGAR_FEEDBACK_BACKEND=gcp
            FIRESTORE_DATABASE_ID=(default)
            FIRESTORE_FEEDBACK_COLLECTION=analyst_feedback
            IAP_STRICT_MODE=true
            IAP_ASSERTION_DEFAULT_ROLE=analyst
          secrets: |-
            SEC_EDGAR_USER_AGENT=sec-edgar-user-agent:latest
            GEMINI_API_KEY=sec-edgar-gemini-api-key:latest
            INTERNAL_IAP_AUDIENCE=sec-edgar-iap-audience:latest
          flags: >-
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --no-allow-unauthenticated
            --cpu=2
            --memory=4Gi
            --concurrency=8
            --min-instances=1
            --max-instances=10
            --timeout=300
            --startup-probe=httpGet.path=/health,initialDelaySeconds=0,periodSeconds=10,timeoutSeconds=5,failureThreshold=24

      # The service is not reachable from GitHub's runners: in load_balancer mode its
      # ingress is internal-and-cloud-load-balancing (run.app answers 404), and in
      # iap_direct mode IAP gates every request. Health is therefore verified inside
      # Cloud Run: the startup probe above sends GET /health to the new revision, and
      # Cloud Run only marks the revision Ready (and the deploy step only succeeds)
      # once /health returns 200. This step confirms that revision is the one serving.
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the new revision passed its /health probe and serves all traffic
        id: verify_revision
        env:
          EXPECTED_IMAGE: ${{ env.IMAGE_URI }}:${{ github.sha }}
        run: |
          set -euo pipefail
          svc="$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format=json)"

          created="$(jq -r '.status.latestCreatedRevisionName' <<<"${svc}")"
          ready="$(jq -r '.status.latestReadyRevisionName' <<<"${svc}")"
          image="$(jq -r '.spec.template.spec.containers[0].image' <<<"${svc}")"
          probe_path="$(jq -r '.spec.template.spec.containers[0].startupProbe.httpGet.path // ""' <<<"${svc}")"
          traffic="$(jq -r --arg rev "${ready}" \
            '[.status.traffic[] | select(.revisionName == $rev) | .percent] | add // 0' <<<"${svc}")"
          # Ingress and IAP settings come from the v2 API (iapEnabled is v2-only).
          svc_v2="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $(gcloud auth print-access-token)" \
            "https://run.googleapis.com/v2/projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/${SERVICE_NAME}")"
          ingress="$(jq -r '.ingress // "INGRESS_TRAFFIC_ALL"' <<<"${svc_v2}")"
          iap="$(jq -r '.iapEnabled // false' <<<"${svc_v2}")"

          echo "revision=${ready} image=${image} probe=${probe_path} traffic=${traffic}% ingress=${ingress} iap=${iap}"
          fail=0
          [[ "${created}" == "${ready}" ]] || { echo "::error::Latest revision ${created} is not Ready (serving ${ready})."; fail=1; }
          [[ "${image}" == "${EXPECTED_IMAGE}" ]] || { echo "::error::Service image is ${image}, expected ${EXPECTED_IMAGE}."; fail=1; }
          [[ "${probe_path}" == "/health" ]] || { echo "::error::Startup probe is not GET /health (got '${probe_path}')."; fail=1; }
          [[ "${traffic}" == "100" ]] || { echo "::error::Revision ${ready} serves ${traffic}% of traffic, expected 100%."; fail=1; }
          if (( fail )); then exit 1; fi

          if [[ "${ingress}" == "INGRESS_TRAFFIC_ALL" && "${iap}" != "true" ]]; then
            echo "public_http=true" >> "${GITHUB_OUTPUT}"
          else
            echo "public_http=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Mint OIDC ID token for Cloud Run health check
        id: id_token_auth
        if: steps.verify_revision.outputs.public_http == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy_cloud_run.outputs.url }}
          id_token_include_email: true

      # Only runs when the service accepts direct internet traffic without IAP.
      - name: Verify deployed Cloud Run service health and frontend UI over HTTPS
        if: steps.verify_revision.outputs.public_http == 'true'
        run: |
          SERVICE_URL="${{ steps.deploy_cloud_run.outputs.url }}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${{ steps.id_token_auth.outputs.id_token }}" \
            "${SERVICE_URL}/health"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${{ steps.id_token_auth.outputs.id_token }}" \
            "${SERVICE_URL}/" > /dev/null
