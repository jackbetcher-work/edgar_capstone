# ==============================================================================
# Google Cloud Build CI/CD Pipeline
# Started by the Terraform-managed triggers in terraform/cloudbuild.tf:
#   - push / merge to main  -> _PIPELINE_MODE=deploy (lint, test, build, push, deploy)
#   - pull request into main -> _PIPELINE_MODE=verify (lint, test, build + smoke test)
# There is no offline mode: `test` and the container smoke test read live GCP data with
# the Cloud Build service account's credentials (see terraform/ci_live_test_access.tf).
# Manual `gcloud builds submit` runs default to deploy mode.
# Stages: parallel `lint-python`, `lint-terraform`, `frontend`, `test` gates
#         -> `build` -> `deploy`.
# Zero secrets or keys are exposed in this pipeline; all sensitive values are
# retrieved dynamically from Google Cloud Secret Manager (`availableSecrets`).
# ==============================================================================

substitutions:
  _REGION: us-central1
  _PROJECT_NAME: fde-sec-edgar-sandbox-dev
  _GAR_REPOSITORY: sec-edgar-repo
  _SERVICE_NAME: sec-edgar-analyst
  _RUNTIME_SA: sec-analyst-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_IDENTITY_DOMAIN: fde-workspace.corp
  _ADMIN_GROUPS: sec-edgar-admins@fde-workspace.corp
  _ANALYST_GROUPS: sec-edgar-analysts@fde-workspace.corp
  _VIEWER_GROUPS: sec-edgar-viewers@fde-workspace.corp
  _BIGQUERY_DATASET: sec_edgar
  _SEC_CORPUS_BUCKET: fde-sec-edgar-sandbox-dev-sec-corpus
  _ANALYST_MODEL: gemini-3.8-flash
  _FLASH_MODEL: gemini-3.8-flash
  _LITE_MODEL: gemini-3.5-flash-lite
  _GEMINI_LOCATION: global
  # App role for users admitted by IAP who match no RBAC group (IAP_ASSERTION_DEFAULT_ROLE).
  _IAP_DEFAULT_ROLE: analyst
  _PIPELINE_MODE: deploy
  # Eval gate mode: skip (default), advisory (run & warn, don't block), or blocking.
  _EVAL_GATE_MODE: skip
  _RUFF_VERSION: 0.17.4
  _TERRAFORM_VERSION: 1.9.8

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ----------------------------------------------------------------------------
  # Stage 1: Quality gates (all four run in parallel; any failure stops the build)
  # ----------------------------------------------------------------------------
  - id: lint-python
    name: python:3.11-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m pip install --quiet --upgrade pip
        pip install --quiet "ruff==${_RUFF_VERSION}"
        ruff check --output-format=full .
        ruff format --check --diff .

  - id: lint-terraform
    name: hashicorp/terraform:${_TERRAFORM_VERSION}
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform fmt -check -recursive -diff terraform/
        cd terraform
        terraform init -backend=false -input=false -no-color
        terraform validate -no-color

  - id: frontend
    name: node:22-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run lint
        npm --prefix frontend test

  # The suite reads live BigQuery / Vertex AI Search / GCS data and calls Vertex AI
  # (embeddings, Gemini, Model Armor) with the build service account's ADC. Telemetry and
  # feedback stay in memory so CI never writes production telemetry.
  - id: test
    name: python:3.11-slim
    waitFor: ["-"]
    env:
      - EDGAR_TEST_PROJECT_ID=${PROJECT_ID}
      - GCP_PROJECT_ID=${PROJECT_ID}
      - GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - GOOGLE_CLOUD_LOCATION=${_REGION}
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - EDGAR_GEMINI_LOCATION=${_GEMINI_LOCATION}
      - EDGAR_TELEMETRY_BACKEND=local
      - EDGAR_FEEDBACK_BACKEND=local
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m pip install --quiet --upgrade pip
        pip install --quiet -e ".[dev]"
        python scripts/verify_no_secrets.py
        pytest -v --tb=short --cov=edgar_capstone --cov-report=term-missing --cov-fail-under=80

  # ----------------------------------------------------------------------------
  # Stage 2: Build — Build frontend + backend container image, smoke test, and
  # push to GAR (push skipped in verify mode)
  # ----------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor:
      - lint-python
      - lint-terraform
      - frontend
      - test
    secretEnv:
      - SEC_EDGAR_USER_AGENT
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        test -n "$${SEC_EDGAR_USER_AGENT}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}"
        docker build \
          --build-arg COMMIT_SHA="${COMMIT_SHA}" \
          --tag "$${IMAGE_URI}:${COMMIT_SHA}" \
          --tag "$${IMAGE_URI}:latest" \
          .
        docker run --rm --entrypoint test "$${IMAGE_URI}:${COMMIT_SHA}" -f /app/frontend/dist/index.html
        # Container smoke test: /health + data_backend block, the UI at /, and one live
        # BigQuery read. --network=cloudbuild gives the container the build SA's ADC.
        docker run --rm --network=cloudbuild \
          -e GCP_PROJECT_ID=${PROJECT_ID} \
          -e GOOGLE_CLOUD_PROJECT=${PROJECT_ID} \
          -e GOOGLE_CLOUD_LOCATION=${_REGION} \
          -e GOOGLE_GENAI_USE_VERTEXAI=true \
          -e EDGAR_GEMINI_LOCATION=${_GEMINI_LOCATION} \
          -e EDGAR_TELEMETRY_BACKEND=local \
          -e EDGAR_FEEDBACK_BACKEND=local \
          --entrypoint python \
          "$${IMAGE_URI}:${COMMIT_SHA}" \
          -m scripts.container_smoke_test --in-process --live-data
        if [ "${_PIPELINE_MODE}" != "deploy" ]; then
          echo "_PIPELINE_MODE=${_PIPELINE_MODE}: image built and smoke-tested; skipping push."
          exit 0
        fi
        docker push "$${IMAGE_URI}:${COMMIT_SHA}"
        docker push "$${IMAGE_URI}:latest"

  # ----------------------------------------------------------------------------
  # Stage 2.5: Eval Gate — Live golden regression gates (main deploy only;
  # optional via _EVAL_GATE_MODE: skip [default], advisory, or blocking)
  # ----------------------------------------------------------------------------
  # TTFT delta & concurrency (agentic tool selection refactor)
  #   The p95_ttft_ms gate target stays 3000 ms (evals/thresholds.yaml). TTFT =
  #   react_execution.observed_ttft_ms: first streamed token / function call of the FIRST
  #   analyst model call, timed from ADK stream start. `scripts/run_evals.py` defaults to
  #   `--concurrency 4` to finish within CI timeouts; because concurrent requests can inflate
  #   p95_ttft_ms, the runner automatically skips the p95_ttft_ms gate when concurrency > 1
  #   (while still recording the measured value). Pass `--concurrency 1` for isolated TTFT gating. The pre-synthesis pre-pass is now RAG-only
  #   (variance / flag / delta / sector map-reduce pre-computation removed), so TTFT is expected
  #   to be unchanged-to-lower. Total turn latency grows by one or more model/tool round-trips
  #   (measured +6 to +17 s) on anomaly / sector-wide turns where the agent calls deterministic
  #   tools, and is roughly unchanged on qualitative and simple quantitative turns.
  #   Measured 2026-11-18: mean TTFT delta -99 ms (n=4 live turns); total latency +1.4 s qualitative,
  #   -0.4 s quant, +17.2 s anomaly, +6.3 s sector-wide. Details: "TTFT delta" in evals/thresholds.yaml.
  # ----------------------------------------------------------------------------
  - id: eval
    name: python:3.11-slim
    waitFor:
      - build
    env:
      - EDGAR_TEST_PROJECT_ID=${PROJECT_ID}
      - GCP_PROJECT_ID=${PROJECT_ID}
      - GOOGLE_CLOUD_PROJECT=${PROJECT_ID}
      - GOOGLE_CLOUD_LOCATION=${_REGION}
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - EDGAR_GEMINI_LOCATION=${_GEMINI_LOCATION}
      - EDGAR_TELEMETRY_BACKEND=local
      - EDGAR_FEEDBACK_BACKEND=local
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_PIPELINE_MODE}" != "deploy" ]; then
          echo "_PIPELINE_MODE=${_PIPELINE_MODE}: skipping full live golden eval gate on PR."
          exit 0
        fi
        case "${_EVAL_GATE_MODE}" in
          skip)
            echo "_EVAL_GATE_MODE=skip: skipping live golden eval gate."
            exit 0
            ;;
          advisory|blocking)
            ;;
          *)
            echo "ERROR: invalid _EVAL_GATE_MODE='${_EVAL_GATE_MODE}' (expected skip, advisory, or blocking)." >&2
            exit 2
            ;;
        esac
        python -m pip install --quiet --upgrade pip
        pip install --quiet -e ".[dev]"
        if [ "${_EVAL_GATE_MODE}" = "blocking" ]; then
          python scripts/run_evals.py --write-bigquery --project-id "${PROJECT_ID}"
        else
          python scripts/run_evals.py --write-bigquery --project-id "${PROJECT_ID}" || \
            echo "WARNING: Live golden eval gates failed in advisory mode; continuing to deploy."
        fi

  # ----------------------------------------------------------------------------
  # Stage 3: Deploy — Deploy container to Cloud Run with Secret Manager mounts
  # ----------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor:
      - build
      - eval
    secretEnv:
      - SEC_EDGAR_USER_AGENT
      - GEMINI_API_KEY
      - INTERNAL_IAP_AUDIENCE
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_PIPELINE_MODE}" != "deploy" ]; then
          echo "_PIPELINE_MODE=${_PIPELINE_MODE}: skipping Cloud Run deploy."
          exit 0
        fi
        test -n "$${SEC_EDGAR_USER_AGENT}"
        test -n "$${GEMINI_API_KEY}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}"
        # Labels: underscore keys only. Cloud Logging copies Cloud Run labels onto every
        # LogEntry, and the BigQuery log sink normalizes '-' to '_', so a revision carrying
        # both `managed-by` (legacy deploy-cloudrun default) and Terraform's `managed_by`
        # breaks the sink with table_invalid_schema. Strip the hyphenated legacy keys here.
        gcloud run deploy "${_SERVICE_NAME}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --image="$${IMAGE_URI}" \
          --service-account="${_RUNTIME_SA}" \
          --no-allow-unauthenticated \
          --cpu=2 \
          --memory=4Gi \
          --concurrency=8 \
          --min-instances=1 \
          --max-instances=10 \
          --timeout=300 \
          --update-labels="commit_sha=${COMMIT_SHA},deployed_by=cloud-build" \
          --remove-labels="managed-by,commit-sha" \
          --startup-probe=httpGet.path=/health,initialDelaySeconds=0,periodSeconds=10,timeoutSeconds=5,failureThreshold=24 \
          --update-env-vars="GCP_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GCP_PROJECT_NAME=${_PROJECT_NAME},GCP_REGION=${_REGION},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=true,EDGAR_ANALYST_MODEL=${_ANALYST_MODEL},EDGAR_FLASH_MODEL=${_FLASH_MODEL},EDGAR_LITE_MODEL=${_LITE_MODEL},EDGAR_GEMINI_LOCATION=${_GEMINI_LOCATION},EDGAR_MODEL_ARMOR_MODE=gcp,MODEL_ARMOR_TEMPLATE_ID=sec-edgar-analyst-armor,SDP_INSPECT_TEMPLATE_ID=sec-edgar-sdp-inspect,SDP_DEIDENTIFY_TEMPLATE_ID=sec-edgar-sdp-deidentify,EDGAR_PROMPT_STORE_BACKEND=auto,EDGAR_TELEMETRY_BACKEND=gcp,EDGAR_FEEDBACK_BACKEND=gcp,OTEL_SERVICE_NAME=${_SERVICE_NAME},OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental,OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=SPAN_AND_EVENT,OTEL_INSTRUMENTATION_GENAI_EMIT_EVENT=true,ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS=true,GOOGLE_CLOUD_AGENT_ENGINE_ENABLE_TELEMETRY=true,EDGAR_TRACE_CAPTURE_CONTENT=true,FIRESTORE_DATABASE_ID=(default),FIRESTORE_FEEDBACK_COLLECTION=analyst_feedback,RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SA},CLOUD_IDENTITY_DOMAIN=${_CLOUD_IDENTITY_DOMAIN},ADMIN_CLOUD_IDENTITY_GROUPS=${_ADMIN_GROUPS},ANALYST_CLOUD_IDENTITY_GROUPS=${_ANALYST_GROUPS},VIEWER_CLOUD_IDENTITY_GROUPS=${_VIEWER_GROUPS},BIGQUERY_DATASET_ID=${_BIGQUERY_DATASET},SEC_CORPUS_BUCKET=${_SEC_CORPUS_BUCKET},IAP_STRICT_MODE=true,IAP_ASSERTION_DEFAULT_ROLE=${_IAP_DEFAULT_ROLE}" \
          --set-secrets="SEC_EDGAR_USER_AGENT=sec-edgar-user-agent:latest,GEMINI_API_KEY=sec-edgar-gemini-api-key:latest,INTERNAL_IAP_AUDIENCE=sec-edgar-iap-audience:latest"
        JOB_NAME="${_SERVICE_NAME}-chunk-health-publisher"
        if gcloud run jobs describe "$${JOB_NAME}" --project="${PROJECT_ID}" --region="${_REGION}" >/dev/null 2>&1; then
          gcloud run jobs update "$${JOB_NAME}" \
            --project="${PROJECT_ID}" \
            --region="${_REGION}" \
            --image="$${IMAGE_URI}" \
            --update-labels="commit_sha=${COMMIT_SHA},deployed_by=cloud-build"
        fi

# No top-level `images:` block: Cloud Build would push those tags even in verify
# mode. The build step pushes explicitly when _PIPELINE_MODE=deploy.

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-user-agent/versions/latest
      env: SEC_EDGAR_USER_AGENT
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-gemini-api-key/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-iap-audience/versions/latest
      env: INTERNAL_IAP_AUDIENCE
