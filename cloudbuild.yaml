# ==============================================================================
# Google Cloud Build CI/CD Pipeline
# Started by the Terraform-managed triggers in terraform/cloudbuild.tf:
#   - push / merge to main  -> _PIPELINE_MODE=deploy (lint, test, build, push, deploy)
#   - pull request into main -> _PIPELINE_MODE=verify (lint, test, build + smoke test)
# Manual `gcloud builds submit` runs default to deploy mode.
# Stages: parallel `lint-python`, `lint-terraform`, `frontend`, `test` gates
#         -> `build` -> `deploy`.
# Zero secrets or keys are exposed in this pipeline; all sensitive values are
# retrieved dynamically from Google Cloud Secret Manager (`availableSecrets`).
# ==============================================================================

substitutions:
  _REGION: us-central1
  _PROJECT_NAME: fde-sec-edgar-sandbox-dev
  _GAR_REPOSITORY: sec-edgar-repo
  _SERVICE_NAME: sec-edgar-analyst
  _RUNTIME_SA: sec-analyst-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _CLOUD_IDENTITY_DOMAIN: fde-workspace.corp
  _ADMIN_GROUPS: sec-edgar-admins@fde-workspace.corp
  _ANALYST_GROUPS: sec-edgar-analysts@fde-workspace.corp
  _VIEWER_GROUPS: sec-edgar-viewers@fde-workspace.corp
  _BIGQUERY_DATASET: sec_edgar
  _SEC_CORPUS_BUCKET: fde-sec-edgar-sandbox-dev-sec-corpus
  _ANALYST_MODEL: gemini-3.8-flash
  _FLASH_MODEL: gemini-3.5-flash
  _GEMINI_LOCATION: global
  # App role for users admitted by IAP who match no RBAC group (IAP_ASSERTION_DEFAULT_ROLE).
  _IAP_DEFAULT_ROLE: analyst
  _PIPELINE_MODE: deploy
  _RUFF_VERSION: 0.17.4
  _TERRAFORM_VERSION: 1.9.8

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ----------------------------------------------------------------------------
  # Stage 1: Quality gates (all four run in parallel; any failure stops the build)
  # ----------------------------------------------------------------------------
  - id: lint-python
    name: python:3.11-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m pip install --quiet --upgrade pip
        pip install --quiet "ruff==${_RUFF_VERSION}"
        ruff check --output-format=full .
        ruff format --check --diff .

  - id: lint-terraform
    name: hashicorp/terraform:${_TERRAFORM_VERSION}
    waitFor: ["-"]
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        terraform fmt -check -recursive -diff terraform/
        cd terraform
        terraform init -backend=false -input=false -no-color
        terraform validate -no-color

  - id: frontend
    name: node:22-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm --prefix frontend ci --no-audit --no-fund
        npm --prefix frontend run lint
        npm --prefix frontend test

  - id: test
    name: python:3.11-slim
    waitFor: ["-"]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m pip install --quiet --upgrade pip
        pip install --quiet -e ".[dev]"
        python scripts/verify_no_secrets.py
        pytest -v --tb=short

  # ----------------------------------------------------------------------------
  # Stage 2: Build — Build frontend + backend container image, smoke test, and
  # push to GAR (push skipped in verify mode)
  # ----------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor:
      - lint-python
      - lint-terraform
      - frontend
      - test
    secretEnv:
      - SEC_EDGAR_USER_AGENT
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        test -n "$${SEC_EDGAR_USER_AGENT}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}"
        docker build \
          --build-arg COMMIT_SHA="${COMMIT_SHA}" \
          --tag "$${IMAGE_URI}:${COMMIT_SHA}" \
          --tag "$${IMAGE_URI}:latest" \
          .
        docker run --rm --entrypoint test "$${IMAGE_URI}:${COMMIT_SHA}" -f /app/frontend/dist/index.html
        # Offline container corpus packaging smoke test (no BigQuery / Vertex / GCS access)
        docker run --rm \
          -e EDGAR_EXECUTION_MODE=deterministic \
          -e EDGAR_DATA_BACKEND=local \
          -e EDGAR_TELEMETRY_BACKEND=local \
          -e EDGAR_FEEDBACK_BACKEND=local \
          -e EDGAR_PROMPT_STORE_BACKEND=local \
          -e EDGAR_MODEL_ARMOR_MODE=disabled \
          --entrypoint python \
          "$${IMAGE_URI}:${COMMIT_SHA}" \
          scripts/container_smoke_test.py --in-process --expect-corpus baked
        if [ "${_PIPELINE_MODE}" != "deploy" ]; then
          echo "_PIPELINE_MODE=${_PIPELINE_MODE}: image built and smoke-tested; skipping push."
          exit 0
        fi
        docker push "$${IMAGE_URI}:${COMMIT_SHA}"
        docker push "$${IMAGE_URI}:latest"

  # ----------------------------------------------------------------------------
  # Stage 3: Deploy — Deploy container to Cloud Run with Secret Manager mounts
  # ----------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor:
      - build
    secretEnv:
      - SEC_EDGAR_USER_AGENT
      - GEMINI_API_KEY
      - INTERNAL_IAP_AUDIENCE
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ "${_PIPELINE_MODE}" != "deploy" ]; then
          echo "_PIPELINE_MODE=${_PIPELINE_MODE}: skipping Cloud Run deploy."
          exit 0
        fi
        test -n "$${SEC_EDGAR_USER_AGENT}"
        test -n "$${GEMINI_API_KEY}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}"
        gcloud run deploy "${_SERVICE_NAME}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --image="$${IMAGE_URI}" \
          --service-account="${_RUNTIME_SA}" \
          --no-allow-unauthenticated \
          --cpu=2 \
          --memory=4Gi \
          --concurrency=8 \
          --min-instances=1 \
          --max-instances=10 \
          --timeout=300 \
          --update-env-vars="GCP_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GCP_PROJECT_NAME=${_PROJECT_NAME},GCP_REGION=${_REGION},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=true,EDGAR_EXECUTION_MODE=auto,EDGAR_ANALYST_MODEL=${_ANALYST_MODEL},EDGAR_FLASH_MODEL=${_FLASH_MODEL},EDGAR_GEMINI_LOCATION=${_GEMINI_LOCATION},EDGAR_MODEL_ARMOR_MODE=gcp,MODEL_ARMOR_TEMPLATE_ID=sec-edgar-analyst-armor,EDGAR_PROMPT_STORE_BACKEND=auto,EDGAR_TELEMETRY_BACKEND=gcp,EDGAR_FEEDBACK_BACKEND=gcp,FIRESTORE_DATABASE_ID=(default),FIRESTORE_FEEDBACK_COLLECTION=analyst_feedback,RUNTIME_SERVICE_ACCOUNT=${_RUNTIME_SA},CLOUD_IDENTITY_DOMAIN=${_CLOUD_IDENTITY_DOMAIN},ADMIN_CLOUD_IDENTITY_GROUPS=${_ADMIN_GROUPS},ANALYST_CLOUD_IDENTITY_GROUPS=${_ANALYST_GROUPS},VIEWER_CLOUD_IDENTITY_GROUPS=${_VIEWER_GROUPS},BIGQUERY_DATASET_ID=${_BIGQUERY_DATASET},SEC_CORPUS_BUCKET=${_SEC_CORPUS_BUCKET},IAP_STRICT_MODE=true,IAP_ASSERTION_DEFAULT_ROLE=${_IAP_DEFAULT_ROLE}" \
          --set-secrets="SEC_EDGAR_USER_AGENT=sec-edgar-user-agent:latest,GEMINI_API_KEY=sec-edgar-gemini-api-key:latest,INTERNAL_IAP_AUDIENCE=sec-edgar-iap-audience:latest"

# No top-level `images:` block: Cloud Build would push those tags even in verify
# mode. The build step pushes explicitly when _PIPELINE_MODE=deploy.

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-user-agent/versions/latest
      env: SEC_EDGAR_USER_AGENT
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-gemini-api-key/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-iap-audience/versions/latest
      env: INTERNAL_IAP_AUDIENCE
