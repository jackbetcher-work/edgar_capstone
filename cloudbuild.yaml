# ==============================================================================
# Google Cloud Build CI/CD Pipeline — Triggered on each push to GitHub
# Composed of explicit `test`, `build`, and `deploy` stages.
# Zero secrets or keys are exposed in this pipeline; all sensitive values are
# retrieved dynamically from Google Cloud Secret Manager (`availableSecrets`).
# ==============================================================================

substitutions:
  _REGION: us-central1
  _GAR_REPOSITORY: sec-edgar-repo
  _SERVICE_NAME: sec-edgar-analyst
  _RUNTIME_SA: sec-analyst-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _BIGQUERY_DATASET: sec_edgar
  _SEC_CORPUS_BUCKET: fde-sec-edgar-sandbox-dev-sec-corpus

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ----------------------------------------------------------------------------
  # Stage 1: Test — Secret-leak scan and automated pytest verification
  # ----------------------------------------------------------------------------
  - id: test
    name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python scripts/verify_no_secrets.py
        pytest -v --tb=short

  # ----------------------------------------------------------------------------
  # Stage 2: Build — Build & push container image to Artifact Registry
  # ----------------------------------------------------------------------------
  - id: build
    name: gcr.io/cloud-builders/docker
    waitFor:
      - test
    secretEnv:
      - SEC_EDGAR_USER_AGENT
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "$${SEC_EDGAR_USER_AGENT}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}"
        docker build \
          --build-arg COMMIT_SHA="${COMMIT_SHA}" \
          --tag "$${IMAGE_URI}:${COMMIT_SHA}" \
          --tag "$${IMAGE_URI}:latest" \
          .
        docker push "$${IMAGE_URI}:${COMMIT_SHA}"
        docker push "$${IMAGE_URI}:latest"

  # ----------------------------------------------------------------------------
  # Stage 3: Deploy — Deploy container to Cloud Run with Secret Manager mounts
  # ----------------------------------------------------------------------------
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor:
      - build
    secretEnv:
      - SEC_EDGAR_USER_AGENT
      - GEMINI_API_KEY
      - INTERNAL_IAP_AUDIENCE
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "$${SEC_EDGAR_USER_AGENT}"
        test -n "$${GEMINI_API_KEY}"
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}"
        gcloud run deploy "${_SERVICE_NAME}" \
          --project="${PROJECT_ID}" \
          --region="${_REGION}" \
          --image="$${IMAGE_URI}" \
          --service-account="${_RUNTIME_SA}" \
          --no-allow-unauthenticated \
          --cpu=2 \
          --memory=4Gi \
          --concurrency=8 \
          --min-instances=1 \
          --max-instances=10 \
          --timeout=300 \
          --set-env-vars="GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},BIGQUERY_DATASET_ID=${_BIGQUERY_DATASET},SEC_CORPUS_BUCKET=${_SEC_CORPUS_BUCKET}" \
          --set-secrets="SEC_EDGAR_USER_AGENT=sec-edgar-user-agent:latest,GEMINI_API_KEY=sec-edgar-gemini-api-key:latest,INTERNAL_IAP_AUDIENCE=sec-edgar-iap-audience:latest"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_GAR_REPOSITORY}/${_SERVICE_NAME}:latest

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-user-agent/versions/latest
      env: SEC_EDGAR_USER_AGENT
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-gemini-api-key/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/sec-edgar-iap-audience/versions/latest
      env: INTERNAL_IAP_AUDIENCE
