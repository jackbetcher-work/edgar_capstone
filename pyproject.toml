[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar-capstone"
version = "0.1.0"
description = "SEC EDGAR Natural Language Analyst - Curated 10-K Dataset & Hybrid RAG Pipeline"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "google-adk>=2.0.0",
    "google-auth>=2.28.0",
    "google-genai>=1.0.0",
    "httpx>=0.25.0",
    "numpy>=1.26.0",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0",
    "opentelemetry-instrumentation-httpx>=0.54b0",
    "opentelemetry-propagator-gcp>=1.9.0",
    "opentelemetry-resourcedetector-gcp>=1.9.0a0",
    "opentelemetry-sdk>=1.39.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
ingest = [
    "edgartools>=5.0.0",
    "google-cloud-storage>=2.16.0",
    "pandas>=2.0.0",
]
dev = [
    "edgartools>=5.0.0",
    "google-cloud-storage>=2.16.0",
    "pandas>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff==0.17.4",
]

[project.scripts]
build-sec-dataset = "scripts.build_sec_dataset:main"
build-vector-db = "scripts.build_vector_db:main"
verify-no-secrets = "scripts.verify_no_secrets:main"
container-smoke-test = "scripts.container_smoke_test:main"
publish-sec-corpus = "scripts.publish_corpus:main"
backfill-rd-metric = "scripts.backfill_rd_metric:main"
run-golden-evals = "scripts.run_evals:main"
load-golden-dataset = "scripts.load_golden_dataset:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["edgar_capstone*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

# ------------------------------------------------------------------------------
# Ruff lint + format gate (`make lint`, Cloud Build `lint-python`, GitHub Actions)
# ------------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "."]
extend-exclude = ["build", "frontend", "terraform", "data", "looker", "prompts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length is enforced by `ruff format`; long literals/URLs are allowed
    "B008",  # FastAPI `Depends(...)` / `Query(...)` defaults are idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["edgar_capstone", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
